<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="70" y="70" width="884" height="884" rx="190" fill="none" stroke="url(#accent)" stroke-width="18" opacity="0.9"/>

  <g filter="url(#shadow)">
    <text
      x="512"
      y="690"
      text-anchor="middle"
      font-family="Rubik, system-ui, -apple-system, Segoe UI, Arial, sans-serif"
      font-size="620"
      font-weight="800"
      fill="#ffffff"
    >
      P
    </text>
  </g>
</svg>

